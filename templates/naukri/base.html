<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NaukriSearch{% endblock %}</title>

  <!-- Google Fonts — matching theme.html -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Ranchers&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       RESET & BASE  (dark theme from theme.html)
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg:        #0d0d0d;
      --surface:   #1a1a1a;
      --surface2:  #242424;
      --border:    #333333;
      --accent:    #fdd835;
      --accent-dk: #f9c800;
      --text:      #ffffff;
      --text-muted:#aaaaaa;
      --text-dim:  #666666;
      --green:     #4caf50;
      --red:       #f44336;
      --tag-bg:    #2a2a2a;
      --radius:    8px;
      --radius-lg: 16px;
      --shadow:    0 4px 24px rgba(0,0,0,.5);
      --transition:.25s ease;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: "Open Sans", sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; vertical-align: middle; }
    button { cursor: pointer; border: none; outline: none; font-family: inherit; }
    ul { list-style: none; margin: 0; padding: 0; }
    p  { margin: 0; }

    /* ============================================================
       SCROLLBAR
    ============================================================ */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track  { background: transparent; }
    ::-webkit-scrollbar-thumb  { background: #444; border-radius: 20px; }
    ::-webkit-scrollbar-thumb:hover { background: #888; }

    /* ============================================================
       LAYOUT HELPERS
    ============================================================ */
    .page-width {
      width: 100%;
      max-width: 1380px;
      margin-inline: auto;
      padding-inline: 20px;
    }

    /* ============================================================
       HEADER / NAV
    ============================================================ */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1380px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      gap: 24px;
      height: 62px;
    }

    .site-logo {
      font-family: "Ranchers", sans-serif;
      font-size: 1.6rem;
      color: var(--accent);
      white-space: nowrap;
      letter-spacing: .02em;
    }
    .site-logo span { color: var(--text); }

    /* Inline header search bar (shown only when results are displayed) */
    .header-search-form {
      flex: 1;
      display: flex;
      gap: 8px;
      max-width: 560px;
    }

    /* ============================================================
       BUTTONS
    ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 22px;
      height: 40px;
      border-radius: var(--radius);
      font-family: "Ranchers", sans-serif;
      font-size: 1rem;
      letter-spacing: .04em;
      transition: background var(--transition), color var(--transition), transform var(--transition);
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #0d0d0d;
    }
    .btn-primary:hover { background: var(--accent-dk); transform: translateY(-1px); }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-outline:hover { background: var(--accent); color: #0d0d0d; }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .btn-sm { height: 32px; padding: 0 14px; font-size: .85rem; }

    /* ============================================================
       FORM INPUTS
    ============================================================ */
    .search-input {
      flex: 1;
      height: 40px;
      padding: 0 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .95rem;
      font-family: inherit;
      transition: border-color var(--transition);
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-input:focus { outline: none; border-color: var(--accent); }

    /* ============================================================
       BADGES / TAGS
    ============================================================ */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge-green  { background: rgba(76,175,80,.15);  color: #81c784; border: 1px solid rgba(76,175,80,.3); }
    .badge-yellow { background: rgba(253,216,53,.12); color: var(--accent); border: 1px solid rgba(253,216,53,.3); }
    .badge-red    { background: rgba(244,67,54,.12);  color: #e57373; border: 1px solid rgba(244,67,54,.3); }
    .badge-gray   { background: var(--tag-bg); color: var(--text-muted); border: 1px solid var(--border); }

    /* ============================================================
       SKILL TAGS
    ============================================================ */
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      display: inline-block;
      padding: 3px 10px;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: .75rem;
      color: var(--text-muted);
      transition: border-color var(--transition), color var(--transition);
    }
    .tag:hover { border-color: var(--accent); color: var(--accent); }

    /* ============================================================
       CARDS / SURFACES
    ============================================================ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .card:hover { border-color: #555; box-shadow: var(--shadow); }

    /* ============================================================
       DIVIDER
    ============================================================ */
    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    /* ============================================================
       ALERT / ERROR BANNER
    ============================================================ */
    .alert {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 20px;
      border-radius: var(--radius);
      font-size: .9rem;
    }
    .alert-error  { background: rgba(244,67,54,.1);  border: 1px solid rgba(244,67,54,.3);  color: #ef9a9a; }
    .alert-info   { background: rgba(253,216,53,.06); border: 1px solid rgba(253,216,53,.2); color: var(--accent); }

    /* ============================================================
       LOADING SPINNER
    ============================================================ */
    .spinner-wrap {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; padding: 60px 20px; color: var(--text-muted);
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       PAGINATION
    ============================================================ */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 32px 0 40px;
      flex-wrap: wrap;
    }

    .page-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: .9rem;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
      text-decoration: none;
    }
    .page-btn:hover { border-color: var(--accent); color: var(--accent); }
    .page-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d0d0d;
      font-weight: 700;
    }
    .page-btn.disabled {
      opacity: .35;
      pointer-events: none;
    }
    .page-ellipsis {
      color: var(--text-dim);
      padding: 0 4px;
      font-size: 1.1rem;
      line-height: 38px;
    }

    /* ============================================================
       FOOTER
    ============================================================ */
    .site-footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
      font-size: .8rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 640px) {
      .header-search-form { display: none; }
      .btn { font-size: .85rem; padding: 0 14px; }
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-inner">
      <a href="{% url 'naukri:index' %}" class="site-logo">Naukri<span>Search</span></a>

      {% block header_search %}{% endblock %}
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="page-width" style="padding-top: 32px; padding-bottom: 32px; flex: 1;">
    {% block content %}{% endblock %}
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <p>NaukriSearch &mdash; a personal job aggregator. Data sourced from&nbsp;naukri.com.</p>
  </footer>

  {% block extra_js %}{% endblock %}
</body>
</html>
